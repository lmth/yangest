[package]
name = "yangest-plugin-bundle-imports"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Magnus Thoäng <magnusthoang@gmail.com>"]
description = "yangest plugin: report the non-local (cross-bundle) imports of a collection of YANG modules"

[dependencies]
yangest-core = { path = "../../core" }
inventory = "0.3"
clap = { version = "4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
